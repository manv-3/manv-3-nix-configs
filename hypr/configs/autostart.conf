#################
### AUTOSTART ###
#################

# Environment & Portal setup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent
exec-once = hypridle

# Wallpaper daemon
exec-once = awww-daemon & sleep 1; $HOME/.config/hypr/scripts/wallpapers/set-random.sh

# Quickshell Desktop Bar (starts lotus shell as default, toggle with SUPER+B)
exec-once = quickshell -p ~/.config/quickshell/lotus-dotfiles/shell.qml

# System audio & notifications
exec-once = playerctld
