# ==============================================================================
# General Hyprland Settings (Portable / Default Rice Configuration)
# ==============================================================================

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 0.98
    inactive_opacity = 0.88
    
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000033)
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 0
}

cursor {
    no_hardware_cursors = false
    min_refresh_rate = 60
}
