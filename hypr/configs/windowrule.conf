$inFocusOpacity = 0.95
$notInFocusOpacity = 0.85

windowrule = suppress_event maximize, match:class .*
windowrule = opacity 1.0 1.0, match:class ^(kitty)$
windowrule = float 1, match:class ^(pearos-settings-app)$
windowrule = center 1, match:class ^(pearos-settings-app)$
windowrule = size 700 600, match:class ^(pearos-settings-app)$
